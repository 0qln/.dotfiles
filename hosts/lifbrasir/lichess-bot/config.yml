# Lichess OAuth2 Token.
token: invalid
# Lichess base URL.
url: https://lichess.org/
# Engine settings.
engine:
    # Directory containing the engine. This can be an absolute path or one relative to lichess-bot/.
    dir: /root/lichess-bot/engines/
    # Binary name of the engine to use.
    name: nephrid
    # When enabled, log all startup communication with the engine.
    debug: false
    # interpreter: "java"
    # interpreter_options:
    #   - "-jar"
    # Directory where the chess engine will read and write files. If blank or missing, the current directory is used.
    working_dir: ""
    # NOTE: If working_dir is set, the engine will look for files and directories relative to this directory, not where lichess-bot was launched. Absolute paths are unaffected.
    # "uci", "xboard" or "homemade"
    protocol: uci
    # Think on opponent's time.
    ponder: true
    polyglot:
        # Activate polyglot book.
        enabled: false
        book:
            # List of book file paths for variant standard.
            standard:
                - engines/book1.bin
                - engines/book2.bin
                #     atomic:                      # List of book file paths for variant atomic.
                #       - engines/atomicbook1.bin
                #       - engines/atomicbook2.bin
                #     etc.
                #     Use the same pattern for 'chess960', 'giveaway' (antichess), 'crazyhouse', 'horde', 'kingofthehill', 'racingkings' and '3check' as well.
        # Does not select moves with weight below min_weight (min 0, max: 100 if normalization isn't "none" else 65535).
        min_weight: 1
        # Move selection is one of "weighted_random", "uniform_random" or "best_move" (but not below the min_weight in the 2nd and 3rd case).
        selection: weighted_random
        # How many moves from the start to take from the book.
        max_depth: 20
        # Normalization method for the book weights. One of "none", "sum", or "max".
        normalization: none
    draw_or_resign:
        # Whether or not the bot should resign.
        resign_enabled: false
        # If the score is less than or equal to this value, the bot resigns (in cp).
        resign_score: -1000
        # If true the bot will resign in positions where the online_egtb returns a wdl of -2.
        resign_for_egtb_minus_two: true
        # How many moves in a row the score has to be below the resign value.
        resign_moves: 3
        # Whether or not the bot should offer/accept draw.
        offer_draw_enabled: true
        # If the absolute value of the score is less than or equal to this value, the bot offers/accepts draw (in cp).
        offer_draw_score: 0
        # If true the bot will offer/accept draw in positions where the online_egtb returns a wdl of 0.
        offer_draw_for_egtb_zero: true
        # How many moves in a row the absolute value of the score has to be below the draw value.
        offer_draw_moves: 10
        # Only if the pieces on board are less than or equal to this value, the bot offers/accepts draw.
        offer_draw_pieces: 10
    online_moves:
        # Stop using online opening books after they don't have a move for 'max_out_of_book_moves' positions. Doesn't apply to the online endgame tablebases.
        max_out_of_book_moves: 10
        # The maximum amount of retries when getting an online move.
        max_retries: 2
        # max_depth: 10                # How many moves from the start to take from online books. Default is no limit.
        chessdb_book:
            # Whether or not to use chessdb book.
            enabled: false
            # Minimum time (in seconds) to use chessdb book.
            min_time: 20
            # Maximum starting game time (in seconds) to use chessdb book.
            max_time: 10800
            # One of "all", "good", "best".
            move_quality: good
            # Only for move_quality: "best".
            min_depth: 20
        lichess_cloud_analysis:
            # Whether or not to use lichess cloud analysis.
            enabled: false
            # Minimum time (in seconds) the bot must have to use cloud analysis.
            min_time: 20
            # Maximum starting game time (in seconds) the bot must have to use cloud analysis.
            max_time: 10800
            # One of "good", "best".
            move_quality: best
            # Only for move_quality: "good". The maximum score difference (in cp) between the best move and the other moves.
            max_score_difference: 50
            min_depth: 20
            min_knodes: 0
        lichess_opening_explorer:
            enabled: false
            min_time: 20
            # Maximum starting game time (in seconds) the bot must have to use the lichess opening explorer.
            max_time: 10800
            # One of "lichess", "masters", "player"
            source: masters
            # The lichess username. Leave empty for the bot's username to be used. Used only when source is "player".
            player_name: ""
            # One of "winrate", "games_played"
            sort: winrate
            # Minimum number of times a move must have been played to be chosen.
            min_games: 10
        online_egtb:
            # Whether or not to enable online endgame tablebases.
            enabled: false
            # Minimum time (in seconds) the bot must have to use online EGTBs.
            min_time: 20
            # Maximum starting game time (in seconds) the bot must have to use online EGTBs.
            max_time: 10800
            # Maximum number of pieces on the board to use endgame tablebases.
            max_pieces: 8
            # One of "lichess", "chessdb".
            source: lichess
            # One of "best" or "suggest" (it takes all the moves with the same WDL and tells the engine to only consider these; will move instantly if there is only 1 "good" move).
            move_quality: best
    # The tablebases list here will be read by lichess-bot, not the engine.
    lichess_bot_tbs:
        syzygy:
            # Whether or not to use local syzygy endgame tablebases.
            enabled: false
            # Paths to Syzygy endgame tablebases.
            paths:
                - engines/syzygy
            # Maximum number of pieces in the endgame tablebase.
            max_pieces: 7
            # One of "best" or "suggest" (it takes all the moves with the same WDL and tells the engine to only consider these; will move instantly if there is only 1 "good" move).
            move_quality: best
        gaviota:
            # Whether or not to use local gaviota endgame tablebases.
            enabled: false
            paths:
                - engines/gaviota
            max_pieces: 5
            # The minimum DTM to consider as syzygy WDL=1/-1. Set to 100 to disable.
            min_dtm_to_consider_as_wdl_1: 120
            # One of "best" or "suggest" (it takes all the moves with the same WDL and tells the engine to only consider these; will move instantly if there is only 1 "good" move).
            move_quality: best
            # engine_options:                  # Any custom command line params to pass to the engine.
            #   cpuct: 3.1
    homemade_options: null
    #   Hash: 256
    # Arbitrary UCI options passed to the engine.
    uci_options: null
    # Move Overhead: 100             # Increase if your bot flags games too often.
    # Threads: 4                     # Max CPU threads the engine can use.
    # Hash: 512                      # Max memory (in megabytes) the engine can allocate.
    # SyzygyPath: "./syzygy/"        # Paths to Syzygy endgame tablebases that the engine reads.
    # UCI_ShowWDL: true              # Show the chance of the engine winning.
    #   go_commands:                   # Additional options to pass to the UCI go command.
    #     nodes: 1                     # Search so many nodes only.
    #     depth: 5                     # Search depth ply only.
    #     movetime: 1000               # Integer. Search exactly movetime milliseconds.
    # xboard_options:                  # Arbitrary XBoard options passed to the engine.
    #   cores: "4"
    #   memory: "4096"
    #   egtpath:                       # Directory containing egtb (endgame tablabases), relative to this project. For 'xboard' engines.
    #     gaviota: "Gaviota path"
    #     nalimov: "Nalimov Path"
    #     scorpio: "Scorpio Path"
    #     syzygy: "Syzygy Path"
    #   go_commands:                   # Additional options to pass to the XBoard go command.
    #     depth: 5                     # Search depth ply only.
    #     Do note that the go commands 'movetime' and 'nodes' are invalid and may cause bad time management for XBoard engines.
    # Some engines (yes you, Leela) are very noisy.
    silence_stderr: false
# Time to abort a game in seconds when there is no activity.
abort_time: 30
# Artificially slow down the bot to pretend like it's thinking.
fake_think_time: false
# Time (in ms) to delay after sending a move to prevent "Too Many Requests" errors.
rate_limiting_delay: 0
# Increase if your bot flags games too often.
move_overhead: 2000
# The number of times to allow an opponent to take back a move in a game.
max_takebacks_accepted: 0
# If set to true, then pressing Ctrl-C to quit will only stop lichess-bot after all current games have finished.
quit_after_all_games_finish: false
correspondence:
    # Time in seconds to search in correspondence games.
    move_time: 60
    # How often to check for opponent moves in correspondence games after disconnecting.
    checkin_period: 300
    # Time before disconnecting from a correspondence game.
    disconnect_time: 150
    # Ponder in correspondence games the bot is connected to.
    ponder: false
# Incoming challenges.
challenge:
    # Number of games to play simultaneously.
    concurrency: 1
    # Possible values: "best" and "first".
    sort_by: best
    # Possible values: "none", "human", "bot".
    preference: none
    # Accepts challenges coming from other bots.
    accept_bot: true
    # Accept challenges by bots only.
    only_bot: false
    # Maximum amount of increment to accept a challenge in seconds. The max is 180. Set to 0 for no increment.
    max_increment: 20
    # Minimum amount of increment to accept a challenge in seconds.
    min_increment: 0
    # Maximum amount of base time to accept a challenge in seconds. The max is 10800 (3 hours).
    max_base: 1800
    # Minimum amount of base time to accept a challenge in seconds.
    min_base: 0
    # Maximum number of days per move to accept a challenge for a correspondence game.
    max_days: 14
    # Unlimited games can be accepted by removing this field or specifying .inf
    # Minimum number of days per move to accept a challenge for a correspondence game.
    min_days: 1
    # Chess variants to accept (https://lichess.org/variant).
    variants:
        - standard
        #   - fromPosition
        #   - antichess
        #   - atomic
        #   - chess960
        #   - crazyhouse
        #   - horde
        #   - kingOfTheHill
        #   - racingKings
        #   - threeCheck
    # Time controls to accept (bots are not allowed to play ultraBullet).
    time_controls:
        - bullet
        - blitz
        - rapid
        - classical
        #   - correspondence
    # Game modes to accept.
    modes:
        # Unrated games.
        - casual
        # Rated games - must comment if the engine doesn't try to win.
        - rated
        # block_list:                      # List of users from which the challenges are always declined.
        #   - user1
        #   - user2
        # online_block_list:               # The urls from which to retrieve a list of bot names that will not be challenged. The list should be a text file where each line contains the name of a blocked bot
        #   - example.com/blocklist
        # allow_list:                      # List of users from which challenges are exclusively accepted, all others being declined. If empty, challenges from all users may be accepted.
        #   - user3
        #   - user4
        # recent_bot_challenge_age: 60     # Maximum age of a bot challenge to be considered recent in seconds
        # max_recent_bot_challenges: 2     # Maximum number of recent challenges that can be accepted from the same bot
        # min_rating: 0                   # Minimum rating of the challenger to accept a challenge.
        # max_rating: 4000                # Maximum rating of the challenger to accept a challenge. The maximum rating in lichess is 4000.
        # rating_difference: 300          # Maximum rating difference between the bot and the challenger. Overrides min_rating and max_rating if set.
    # Require that bullet game challenges from bots have a non-zero increment
    bullet_requires_increment: false
    # Maximum number of simultaneous games with the same user
    max_simultaneous_games_per_user: 5
greeting:
    # Optional substitution keywords (include curly braces):
    #   {opponent} to insert opponent's name
    #   {me} to insert bot's name
    # Any other words in curly braces will be removed.
    # Message to send to opponent chat at the start of a game
    hello: Hi! I'm {me}. Good luck! Type !help for a list of commands I can respond to.
    # Message to send to opponent chat at the end of a game
    goodbye: Good game!
    # Message to send to spectator chat at the start of a game
    hello_spectators: Hi! I'm {me}. Type !help for a list of commands I can respond to.
    # Message to send to spectator chat at the end of a game
    goodbye_spectators: Thanks for watching!
# pgn_directory: "game_records"    # A directory where PGN-format records of the bot's games are kept
# pgn_file_grouping: "game"        # How to group games into files. Options are "game", "opponent", and "all"
# "game" (default) - every game is written to a different file named "{White name} vs. {Black name} - {lichess game ID}.pgn"
# "opponent" - every game with a given opponent is written to a file named "{Bot name} games vs. {Opponent name}.pgn"
# "all" - every game is written to a single file named "{Bot name} games.pgn"
matchmaking:
    # Set it to 'true' to challenge other bots.
    allow_matchmaking: false
    # Set it to 'true' to create challenges during long games.
    allow_during_games: false
    # If set to 'random', the bot will choose one variant from the variants enabled in 'challenge.variants'.
    challenge_variant: random
    # Create a challenge after being idle for 'challenge_timeout' minutes. The minimum is 1 minute.
    challenge_timeout: 30
    # Initial time in seconds of the challenge (to be chosen at random).
    challenge_initial_time:
        - 60
        - 180
    # Increment in seconds of the challenge (to be chosen at random).
    challenge_increment:
        - 1
        - 2
        #  challenge_days:                 # Days for correspondence challenge (to be chosen at random).
        #    - 1
        #    - 2
        # opponent_min_rating: 600         # Opponents rating should be above this value (600 is the minimum rating in lichess).
        # opponent_max_rating: 4000        # Opponents rating should be below this value (4000 is the maximum rating in lichess).
    # The maximum difference in rating between the bot's rating and opponent's rating.
    opponent_rating_difference: 300
    # One of "none", "high", "low".
    rating_preference: none
    # Set it to the mode in which challenges are sent. Possible options are 'casual', 'rated' and 'random'.
    challenge_mode: random
    # If a bot declines a challenge, do not issue a similar challenge to that bot. Possible options are 'none', 'coarse', and 'fine'.
    challenge_filter: none
    # block_list:                      # The list of bots that will not be challenged
    #   - user1
    #   - user2
    # online_block_list:               # The urls from which to retrieve a list of bot names that will not be challenged. The list should be a text file where each line contains the name of a blocked bot
    #   - example.com/blocklist
    # Do not challenge bots in the challenge: block_list in addition to the matchmaking block list.
    include_challenge_block_list: false
# overrides:                       # List of overrides for the matchmaking specifications above. When a challenge is created, either the default specification above or one of the overrides will be randomly chosen.
#   bullet_only_horde:             # Name of the override. Can be anything as long as each override has a unique name ("bullet_only_horde" and "easy_chess960" in these examples).
#     challenge_variant: "horde"   # List of options to override. Only the options mentioned will change when making the challenge. The rest will follow the default matchmaking options above.
#     challenge_initial_time:
#       - 1
#       - 2
#     challenge_increment:
#       - 0
#       - 1
#
#   easy_chess960:
#     challenge_variant: "chess960"
#     opponent_min_rating: 400
#     opponent_max_rating: 1200
#     opponent_rating_difference:
#     challenge_mode: casual
#
#   no_pressure_correspondence:
#     challenge_initial_time:
#     challenge_increment:
#     challenge_days:
#       - 2
#       - 3
#     challenge_mode: casual
#
# The following configurations cannot be overridden: allow_matchmaking, challenge_timeout, challenge_filter and block_list.
