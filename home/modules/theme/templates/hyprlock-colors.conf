# --- BASE COLORS ---
$wallpaper = {{wallpaper}}
$background = rgb({{background | strip}})
$background_rgba = rgba({{background | strip}}BB)
$foreground = rgb({{foreground | strip}})
$foreground_raw = ##{{foreground | strip}}
$background_raw = ##{{background | strip}}

# --- STANDARD PALETTE (0-7) ---
$color0 = rgb({{color0 | strip}})
$color1 = rgb({{color1 | strip}})
$color2 = rgb({{color2 | strip}})
$color3 = rgb({{color3 | strip}})
$color4 = rgb({{color4 | strip}})
$color5 = rgb({{color5 | strip}})
$color6 = rgb({{color6 | strip}})
$color7 = rgb({{color7 | strip}})

# --- BRIGHT / ACCENT PALETTE (8-15) ---
$color8  = rgb({{color8 | strip}})
$color9  = rgb({{color9 | strip}})
$color10 = rgb({{color10 | strip}})
$color11 = rgb({{color11 | strip}})
$color12 = rgb({{color12 | strip}})
$color13 = rgb({{color13 | strip}})
$color14 = rgb({{color14 | strip}})
$color15 = rgb({{color15 | strip}})

# --- RAW HEX VARIANTS (Ideal for Pango <span foreground="..."> tags) ---
$color1_raw  = ##{{color1 | strip}}
$color3_raw  = ##{{color3 | strip}}
$color4_raw  = ##{{color4 | strip}}
$color5_raw  = ##{{color5 | strip}}
$color6_raw  = ##{{color6 | strip}}
$color12_raw = ##{{color12 | strip}}
$color13_raw = ##{{color13 | strip}}
$color14_raw = ##{{color14 | strip}}

# --- NEON GLOW & ALPHA VARIANTS ---
# Standard full-opacity RGBA
$color4_rgba  = rgba({{color4 | strip}}FF)
$color12_rgba = rgba({{color12 | strip}}FF)

# 50% Alpha variants (perfect for soft background shadow_color glows)
$color4_glow  = rgba({{color4 | strip}}88)
$color12_glow = rgba({{color12 | strip}}88)
